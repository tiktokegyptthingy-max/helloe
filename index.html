<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Embedded Project</title>
    <style>
        :root {
            color-scheme: light dark;
        }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, "Apple Color Emoji", "Segoe UI Emoji";
            line-height: 1.5;
            display: grid;
            min-height: 100svh;
            grid-template-rows: auto 1fr auto;
            background: #0b1020;
            color: #e8eef9;
        }
        header, footer {
            padding: 16px;
            text-align: center;
            background: #101a3a;
            border-bottom: 1px solid #1b2a52;
        }
        footer { border-top: 1px solid #1b2a52; border-bottom: 0; }
        main { display: grid; place-items: center; padding: 16px; }
        .frame-wrap {
            width: min(100%, 960px);
            aspect-ratio: 16 / 12.5; /* keeps default Scratch 485x402 ratio approx */
            background: #0e1530;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.06);
            overflow: hidden;
        }
        .frame-wrap iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
        a { color: #9ec3ff; }
        .byline { opacity: .8; font-size: .95rem; }
    </style>
    <meta name="description" content="Website embedding a project." />
</head>
<body>
    <header>
        <h1>Project Embed</h1>
        <p class="byline">This page embeds the project below.</p>
    </header>

    <main>
        <div class="frame-wrap">
            <iframe
                src="https://scratch.mit.edu/projects/1231016758/embed"
                allowtransparency="true"
                allowfullscreen
                scrolling="no"
                title="Embedded Project">
            </iframe>
        </div>
    </main>
    
</body>
</html>
